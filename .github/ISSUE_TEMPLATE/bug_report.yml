name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model involved
      placeholder: groq/llama-3.3-70b
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Docker or Node version, host OS and client used (OpenAI SDK, n8n, LangChain…).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs`. Remove any API keys before pasting.
      render: text
